<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Low-Poly Isometric Portfolio Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
            background-color: #dbe2ef;
            color: #0f172a;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }
        /* Glassmorphism Styling */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .glass-button {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(203, 213, 225, 0.6);
            transition: all 0.2s ease;
        }
        .glass-button:hover {
            background: rgba(255, 255, 255, 1);
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
        }
        /* Custom Scrollbar for Modal */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-slate-200 text-slate-800">

    <!-- 3D Canvas Container >
    <div id="canvas-container" class="absolute inset-0 w-full h-full z-0 cursor-grab active:cursor-grabbing"></div>

    <!-- Top Overlay Header -->
    <header class="absolute top-4 left-4 right-4 z-10 flex justify-between items-center pointer-events-none">
        <div class="glass-panel px-5 py-3 rounded-2xl pointer-events-auto shadow-xl flex items-center gap-3 border border-white/60">
            <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
            <div>
                <h1 class="font-bold text-base md:text-lg bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 bg-clip-text text-transparent">
                    3D Interactive Portfolio
                </h1>
                <p class="text-xs text-slate-500 font-medium">Isometric  10x10 Room</p>
            </div>
        </div>

        <!-- Controls Toolbar -->
        <div class="glass-panel p-2 rounded-2xl pointer-events-auto flex items-center gap-2 shadow-xl border border-white/60">
            <button id="reset-cam-btn" title="Reset Camera View" class="glass-button p-2.5 rounded-xl text-slate-700 hover:text-indigo-600 flex items-center gap-2 text-xs font-semibold px-3 shadow-sm">
                <i class="fa-solid fa-camera-rotate text-indigo-500"></i>
                <span class="hidden sm:inline">Reset View</span>
            </button>
            <button id="audio-toggle-btn" title="Toggle Sound FX" class="glass-button p-2.5 rounded-xl text-slate-700 hover:text-indigo-600 flex items-center gap-2 text-xs font-semibold px-3 shadow-sm">
                <i id="audio-icon" class="fa-solid fa-volume-high text-emerald-500"></i>
                <span id="audio-text" class="hidden sm:inline">Sound ON</span>
            </button>
        </div>
    </header>

    <!-- Bottom Left Instructions Hint -->
    <div class="absolute bottom-6 left-6 z-10 pointer-events-none hidden md:block">
        <div class="glass-panel px-4 py-3 rounded-xl border border-white/60 text-xs text-slate-600 space-y-1.5 shadow-lg">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-hand-pointer text-indigo-500"></i>
                <span><strong class="text-slate-800">Click</strong> objects in room to inspect specification</span>
            </div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-arrows-spin text-purple-500"></i>
                <span><strong class="text-slate-800">Left Click + Drag</strong> to rotate isometric camera</span>
            </div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-magnifying-glass-plus text-emerald-500"></i>
                <span><strong class="text-slate-800">Scroll</strong> to zoom in / out</span>
            </div>
        </div>
    </div>

    <!-- Active Hover Tooltip -->
    <div id="hover-tooltip" class="absolute z-20 pointer-events-none opacity-0 transition-opacity duration-200 transform -translate-x-1/2 -translate-y-12">
        <div class="glass-panel px-3 py-1.5 rounded-lg text-xs font-bold text-indigo-900 border border-indigo-300/80 shadow-xl flex items-center gap-2 whitespace-nowrap">
            <i class="fa-solid fa-sparkles text-amber-500 text-xs"></i>
            <span id="tooltip-text">Object Name</span>
        </div>
    </div>

    <!-- Interactive Detail Modal -->
    <div id="portfolio-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="modal-card" class="glass-panel max-w-lg w-full rounded-3xl border border-white/80 shadow-2xl p-6 md:p-8 transform scale-95 transition-transform duration-300 relative overflow-hidden bg-white/90">
            <!-- Modal Header -->
            <div class="flex justify-between items-start mb-5 border-b border-slate-200/80 pb-4">
                <div class="flex items-center gap-3">
                    <div id="modal-icon-bg" class="w-12 h-12 rounded-2xl bg-indigo-50 border border-indigo-200 flex items-center justify-center text-indigo-600 text-xl shadow-sm">
                        <i id="modal-icon" class="fa-solid fa-cube"></i>
                    </div>
                    <div>
                        <h2 id="modal-title" class="text-xl font-bold text-slate-800">Item Title</h2>
                        <span id="modal-subtitle" class="text-xs font-semibold text-indigo-600 uppercase tracking-wider">Category Tag</span>
                    </div>
                </div>
                <button id="close-modal-btn" class="glass-button w-9 h-9 rounded-full flex items-center justify-center text-slate-500 hover:text-slate-800 text-base shadow-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Modal Content Body -->
            <div id="modal-body" class="text-xs md:text-sm text-slate-600 leading-relaxed space-y-3 max-h-[55vh] overflow-y-auto pr-1">
                <!-- Content injected dynamically -->
            </div>

            <!-- Modal Footer -->
            <div class="mt-6 pt-4 border-t border-slate-200/80 flex justify-end">
                <button id="modal-action-btn" class="glass-button px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs flex items-center gap-2 shadow-md">
                    <span>Close Inspection</span>
                    <i class="fa-solid fa-check"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        class SoundFX {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
            }

            playHover() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.04);
                    gain.gain.setValueAtTime(0.015, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.04);
                } catch (e) {}
            }

            playClick() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(160, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.1);
                } catch (e) {}
            }
        }

        const sound = new SoundFX();

        function createProfilePictureTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 680;
            const ctx = canvas.getContext('2d');

            
          

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // Soft Light Grayish Blue Background
        const backgroundColor = new THREE.Color('#dce4ec');
        scene.background = backgroundColor;

        // Isometric Camera Setup
        const aspect = window.innerWidth / window.innerHeight;
        const d = 7.5;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(20, 20, 20);
        camera.lookAt(0, 2, 0);

        // WebGL Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        // Orbit Controls
        let controls;
        if (typeof THREE.OrbitControls !== 'undefined') {
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.02;
            controls.minDistance = 5;
            controls.maxDistance = 50;
            controls.target.set(0, 1.5, 0);
        }

        // Scene Lighting
        const ambientLight = new THREE.AmbientLight('#ffffff', 0.85);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight('#fffaf0', 1.25);
        mainLight.position.set(12, 18, 10);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 40;
        const shadowSize = 8;
        mainLight.shadow.camera.left = -shadowSize;
        mainLight.shadow.camera.right = shadowSize;
        mainLight.shadow.camera.top = shadowSize;
        mainLight.shadow.camera.bottom = -shadowSize;
        mainLight.shadow.bias = -0.0005;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight('#818cf8', 0.4);
        fillLight.position.set(-10, 10, -10);
        scene.add(fillLight);

        const deskLampLight = new THREE.PointLight('#ffaa44', 1.0, 5);
        deskLampLight.position.set(-2.8, 2.6, -3.2);
        deskLampLight.castShadow = true;
        scene.add(deskLampLight);

        function createProceduralBumpTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#8080ff';
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 600; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#9595ff' : '#6b6bff';
                ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
            }
            return new THREE.CanvasTexture(canvas);
        }
        const bumpTex = createProceduralBumpTexture();
        bumpTex.wrapS = THREE.RepeatWrapping;
        bumpTex.wrapT = THREE.RepeatWrapping;
        bumpTex.repeat.set(3, 3);

        // PBR Materials
        const pbrWoodMaterial = new THREE.MeshStandardMaterial({
            color: '#A8D1E7',
            roughness: 0.35,
            metalness: 0.1,
            bumpMap: bumpTex,
            bumpScale: 0.03
        });

        const pbrMetalMaterial = new THREE.MeshStandardMaterial({
            color: '#475569',
            roughness: 0.2,
            metalness: 0.85,
            bumpMap: bumpTex,
            bumpScale: 0.05
        });


        // Custom Vertex Shader Material
        const customVertexShader = `
            uniform float uTime;
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPosition;

            void main() {
                vUv = uv;
                vNormal = normal;
                
                vec3 pos = position;
                float wave = sin(pos.y * 4.0 + uTime * 3.0) * cos(pos.x * 4.0 + uTime * 2.0) * 0.15;
                pos += normal * wave;

                vPosition = pos;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const customFragmentShader = `
            uniform float uTime;
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPosition;

            void main() {
                vec3 colorA = vec3(0.38, 0.40, 0.95);
                vec3 colorB = vec3(0.93, 0.28, 0.60);
                
                float mixFactor = sin(vPosition.y * 2.0 + uTime) * 0.5 + 0.5;
                vec3 color = mix(colorA, colorB, mixFactor);
                
                float rim = 1.0 - max(0.0, dot(vNormal, vec3(0.0, 0.0, 1.0)));
                color += vec3(0.3, 0.4, 0.8) * pow(rim, 3.0);

                gl_FragColor = vec4(color, 0.95);
            }
        `;

        const vertexShaderMaterial = new THREE.ShaderMaterial({
            vertexShader: customVertexShader,
            fragmentShader: customFragmentShader,
            uniforms: { uTime: { value: 0 } },
            transparent: true,
            side: THREE.DoubleSide
        });

        // Interactive Objects Array
        const interactiveObjects = [];

        function registerInteractive(mesh, data) {
            mesh.userData = data;
            interactiveObjects.push(mesh);
        }

        const roomGroup = new THREE.Group();
        scene.add(roomGroup);

        // 10x10 Floor
        const floorGeo = new THREE.BoxGeometry(10, 0.4, 10);
        const floorMat = new THREE.MeshStandardMaterial({ color: '#f1f5f9', roughness: 0.5 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.set(0, -0.2, 0);
        floor.receiveShadow = true;
        roomGroup.add(floor);

        // Carpet Rug
        const rugGeo = new THREE.BoxGeometry(4.5, 0.04, 3.5);
        const rugMat = new THREE.MeshStandardMaterial({ color: '#695A5B', roughness: 0.9 });
        const rug = new THREE.Mesh(rugGeo, rugMat);
        rug.position.set(0.5, 0.02, 0.5);
        rug.receiveShadow = true;
        roomGroup.add(rug);

        registerInteractive(rug, {
            title: "Geometric Carpet Rug",
            category: "Room Decor",
            icon: "fa-rug",
            info: `
                <p class="mb-2"><strong>Dimensions:</strong> 4.5 x 3.5 Units</p>
                <p class="mb-2"><strong>Style:</strong> Soft Fiber Rug</p>
            `
        });

        // Walls (Back Left & Back Right)
        const wallMat = new THREE.MeshStandardMaterial({ color: '#94a3b8', roughness: 0.8 });

        const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(10, 6, 0.3), wallMat);
        wallLeft.position.set(0, 3, -5);
        wallLeft.receiveShadow = true;
        wallLeft.castShadow = true;
        roomGroup.add(wallLeft);

        const wallRight = new THREE.Mesh(new THREE.BoxGeometry(0.3, 6, 10), wallMat);
        wallRight.position.set(-5, 3, 0);
        wallRight.receiveShadow = true;
        wallRight.castShadow = true;
        roomGroup.add(wallRight);

        // Baseboards
        const baseboardMat = new THREE.MeshStandardMaterial({ color: '#2E3136', roughness: 0.4 });
        const baseboard1 = new THREE.Mesh(new THREE.BoxGeometry(9.8, 0.3, 0.1), baseboardMat);
        baseboard1.position.set(0.1, 0.15, -4.8);
        roomGroup.add(baseboard1);

        const baseboard2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 9.8), baseboardMat);
        baseboard2.position.set(-4.8, 0.15, 0.1);
        roomGroup.add(baseboard2);

        // 1. BED MODEL
        const bedGroup = new THREE.Group();
        bedGroup.position.set(2.8, 0, -2.8);

        const bedFrame = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.6, 4.2), pbrWoodMaterial);
        bedFrame.position.set(0, 0.3, 0);
        bedFrame.castShadow = true;
        bedFrame.receiveShadow = true;
        bedGroup.add(bedFrame);

        const headboard = new THREE.Mesh(new THREE.BoxGeometry(3.6, 2.2, 0.3), pbrWoodMaterial);
        headboard.position.set(0, 1.1, -2.0);
        headboard.castShadow = true;
        bedGroup.add(headboard);

        const mattress = new THREE.Mesh(
            new THREE.BoxGeometry(3.3, 0.7, 3.8),
            new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.9 })
        );
        mattress.position.set(0, 0.75, 0.1);
        mattress.castShadow = true;
        mattress.receiveShadow = true;
        bedGroup.add(mattress);

        const blanket = new THREE.Mesh(
            new THREE.BoxGeometry(3.35, 0.72, 2.6),
            new THREE.MeshStandardMaterial({ color: '#92CEA8', roughness: 0.7 })
        );
        blanket.position.set(0, 0.76, 0.65);
        blanket.castShadow = true;
        bedGroup.add(blanket);

        const pillowMat = new THREE.MeshStandardMaterial({ color: '#e2e8f0', roughness: 0.8 });
        const pillow1 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.25, 0.7), pillowMat);
        pillow1.position.set(-0.8, 1.15, -1.3);
        pillow1.rotation.x = 0.2;
        pillow1.castShadow = true;
        bedGroup.add(pillow1);

        const pillow2 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.25, 0.7), pillowMat);
        pillow2.position.set(0.8, 1.15, -1.3);
        pillow2.rotation.x = 0.2;
        pillow2.castShadow = true;
        bedGroup.add(pillow2);

        roomGroup.add(bedGroup);

        registerInteractive(mattress, {
            title: "Bed",
            category: "Furniture",
            icon: "fa-bed",
            info: `
                <p class="mb-2">A cozy isometric bed constructed with layered primitive geometries.</p>
                <p class="mb-2"><strong>Materials:</strong> PBR Oak Wood frame, cotton mattress, and indigo blanket.</p>
            `
        });

        // 2. DESK & WORKSTATION
        const deskGroup = new THREE.Group();
        deskGroup.position.set(-2.8, 0, -3.2);

        const deskTop = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.15, 1.8), pbrWoodMaterial);
        deskTop.position.set(0, 1.5, 0);
        deskTop.castShadow = true;
        deskTop.receiveShadow = true;
        deskGroup.add(deskTop);

        const legGeo = new THREE.CylinderGeometry(0.06, 0.06, 1.5, 12);
        [[-1.4, 0.75, -0.75], [1.4, 0.75, -0.75], [-1.4, 0.75, 0.75], [1.4, 0.75, 0.75]].forEach(pos => {
            const leg = new THREE.Mesh(legGeo, pbrMetalMaterial);
            leg.position.set(...pos);
            leg.castShadow = true;
            deskGroup.add(leg);
        });

        // Laptop
        const laptopMat = new THREE.MeshStandardMaterial({ color: '#cbd5e1', metalness: 0.8, roughness: 0.2 });
        const laptopBase = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.04, 0.6), laptopMat);
        laptopBase.position.set(-0.2, 1.6, 0.1);
        laptopBase.castShadow = true;
        deskGroup.add(laptopBase);

        const laptopScreen = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.55, 0.03), laptopMat);
        laptopScreen.position.set(-0.2, 1.85, -0.18);
        laptopScreen.rotation.x = -0.2;
        laptopScreen.castShadow = true;
        deskGroup.add(laptopScreen);

        const screenGlow = new THREE.Mesh(new THREE.PlaneGeometry(0.82, 0.48), new THREE.MeshBasicMaterial({ color: '#38bdf8' }));
        screenGlow.position.set(-0.2, 1.86, -0.16);
        screenGlow.rotation.x = -0.2;
        deskGroup.add(screenGlow);

        roomGroup.add(deskGroup);

        registerInteractive(deskTop, {
            title: "Workstation Desk",
            category: "PBR Material Showcase",
            icon: "fa-laptop-code",
            info: `
                <p class="mb-2"><strong>PBR Demonstration:</strong> Uses <code>MeshStandardMaterial</code> with roughness, metalness, and bump mapping.</p>
                `
        });

        // 3. OFFICE CHAIR
        const chairGroup = new THREE.Group();
        chairGroup.position.set(-2.8, 0, -1.8);

        const cushionMat = new THREE.MeshStandardMaterial({ color: '#92CEA8', roughness: 0.5 });
        const seat = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.12, 1.1), cushionMat);
        seat.position.set(0, 0.9, 0);
        seat.castShadow = true;
        chairGroup.add(seat);

        const backrest = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.9, 0.1), cushionMat);
        backrest.position.set(0, 1.35, 0.5);
        backrest.castShadow = true;
        chairGroup.add(backrest);

        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.9, 12), pbrMetalMaterial);
        stem.position.set(0, 0.45, 0);
        stem.castShadow = true;
        chairGroup.add(stem);

        const chairBase = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.08, 5), pbrMetalMaterial);
        chairBase.position.set(0, 0.05, 0);
        chairBase.castShadow = true;
        chairGroup.add(chairBase);

        roomGroup.add(chairGroup);

        registerInteractive(seat, {
            title: "Office Chair",
            category: "Furniture ",
            icon: "fa-chair",
            info: `<p>Modern ergonomic chair with metallic frame base and cushion.</p>`
        });

        // 4. PICTURE FRAME WITH STUDENT PORTRAIT
       
        const textureLoader = new THREE.TextureLoader();
        const photoTexture = textureLoader.load('https://ibb.co/8nRyHP57'); 
        const frameGroup = new THREE.Group();
        frameGroup.position.set(-4.8, 3.2, -1.5);
        frameGroup.rotation.y = Math.PI / 2;

        const frameOuter = new THREE.Mesh(new THREE.BoxGeometry(2.0, 2.5, 0.12), pbrWoodMaterial);
        frameOuter.castShadow = true;
        frameGroup.add(frameOuter);

        const photoMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(1.7, 2.2),
            new THREE.MeshBasicMaterial({ map: photoTexture })
        );
        photoMesh.position.z = 0.07;
        frameGroup.add(photoMesh);

        roomGroup.add(frameGroup);

        registerInteractive(frameOuter, {
            title: "Student Photo Frame",
            category: "Texture Mapping Criteria ",
            icon: "fa-image",
            info: `
                <p class="mb-2"><strong>Photo Texture Requirement:</strong> Dynamic canvas-rendered student photo mapped onto wall frame.</p>
            `
        });

        // 6. FLOATING VERTEX SHADER OBJECT
        const artifactGeo = new THREE.TorusKnotGeometry(0.65, 0.2, 100, 16);
        const artifactMesh = new THREE.Mesh(artifactGeo, vertexShaderMaterial);
        artifactMesh.position.set(-2.5, 2.2, 2.2);
        artifactMesh.castShadow = true;
        roomGroup.add(artifactMesh);

        registerInteractive(artifactMesh, {
            title: "Vertex Shader Realtime Anomaly",
            category: "Vertex Shader Criteria ",
            icon: "fa-wand-magic-sparkles",
            info: `
                <p class="mb-2"><strong>Realtime GLSL Vertex Shader</strong></p>
            `
        });

        // 7. SAFE 3D CANVAS TEXT BANNERS (Info Metadata Requirement)
        function create3DTextBanner(line1, line2) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.strokeStyle = 'rgba(99, 102, 241, 0.8)';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.roundRect(10, 10, 1004, 236, 32);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 50px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(line1, 512, 100);

            ctx.fillStyle = '#818cf8';
            ctx.font = '600 36px Inter, sans-serif';
            ctx.fillText(line2, 512, 175);

            const texture = new THREE.CanvasTexture(canvas);
            const planeMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
            return new THREE.Mesh(new THREE.PlaneGeometry(3.6, 0.9), planeMat);
        }

        const banner1 = create3DTextBanner("6721651238 Chayanin Lowsophapirom", "chayanin.l@ku.th");
        banner1.position.set(0, 5.6, -4.7);
        roomGroup.add(banner1);

        const banner2 = create3DTextBanner("6721651238 Chayanin Lowsophapirom", "chayanin.l@ku.th");
        banner2.position.set(-4.7, 5.2, 0);
        banner2.rotation.y = Math.PI / 2;
        roomGroup.add(banner2);

        registerInteractive(banner1, {
            title: "3D Portfolio Info Metadata",
            category: "Info Requirement",
            icon: "fa-graduation-cap",
            info: `
                <div class="space-y-2 text-xs">
                    <p><strong>Name:</strong> Chayanin Lowsophapirom</p>
                    <p><strong>Student ID:</strong> 6721651238 </p>
                    <p><strong>Email:</strong> chayanin.l@ku.th</p>
                </div>
            `
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const tooltip = document.getElementById('hover-tooltip');
        const tooltipText = document.getElementById('tooltip-text');
        let hoveredObject = null;

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects, true);

            if (intersects.length > 0) {
                const object = intersects[0].object;
                if (hoveredObject !== object) {
                    if (hoveredObject && hoveredObject.material && hoveredObject.material.emissive) {
                        hoveredObject.material.emissive.setHex(hoveredObject.currentHex || 0x000000);
                    }
                    hoveredObject = object;
                    sound.playHover();

                    if (hoveredObject.material && hoveredObject.material.emissive) {
                        hoveredObject.currentHex = hoveredObject.material.emissive.getHex();
                        hoveredObject.material.emissive.setHex(0x334155);
                    }

                    document.body.style.cursor = 'pointer';
                    tooltipText.textContent = object.userData.title || 'Interactive Object';
                    tooltip.style.opacity = '1';
                }

                tooltip.style.left = `${event.clientX}px`;
                tooltip.style.top = `${event.clientY}px`;
            } else {
                if (hoveredObject) {
                    if (hoveredObject.material && hoveredObject.material.emissive) {
                        hoveredObject.material.emissive.setHex(hoveredObject.currentHex || 0x000000);
                    }
                    hoveredObject = null;
                }
                document.body.style.cursor = 'default';
                tooltip.style.opacity = '0';
            }
        }

        window.addEventListener('mousemove', onMouseMove);

        const modal = document.getElementById('portfolio-modal');
        const modalCard = document.getElementById('modal-card');
        const modalTitle = document.getElementById('modal-title');
        const modalSubtitle = document.getElementById('modal-subtitle');
        const modalIcon = document.getElementById('modal-icon');
        const modalBody = document.getElementById('modal-body');

        function openModal(data) {
            sound.playClick();
            modalTitle.textContent = data.title || "Item Info";
            modalSubtitle.textContent = data.category || "3D Specification";
            modalIcon.className = `fa-solid ${data.icon || 'fa-cube'}`;
            modalBody.innerHTML = data.info || "<p>Information not specified.</p>";

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-95');
            modalCard.classList.add('scale-100');
        }

        function closeModal() {
            sound.playClick();
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-95');
        }

        window.addEventListener('click', (event) => {
            if (event.target.closest('#portfolio-modal') || event.target.closest('header') || event.target.closest('button')) {
                return;
            }

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects, true);

            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                if (data && data.title) {
                    openModal(data);
                }
            }
        });

        document.getElementById('close-modal-btn').addEventListener('click', closeModal);
        document.getElementById('modal-action-btn').addEventListener('click', closeModal);

        document.getElementById('reset-cam-btn').addEventListener('click', () => {
            sound.playClick();
            if (controls) controls.reset();
            camera.position.set(20, 20, 20);
            camera.lookAt(0, 2, 0);
        });

        const audioBtn = document.getElementById('audio-toggle-btn');
        const audioIcon = document.getElementById('audio-icon');
        const audioText = document.getElementById('audio-text');

        audioBtn.addEventListener('click', () => {
            sound.enabled = !sound.enabled;
            if (sound.enabled) {
                audioIcon.className = 'fa-solid fa-volume-high text-emerald-500';
                audioText.textContent = 'Sound ON';
                sound.playClick();
            } else {
                audioIcon.className = 'fa-solid fa-volume-xmark text-rose-500';
                audioText.textContent = 'Sound OFF';
            }
        });

    

        // Window Resize Event
        window.addEventListener('resize', () => {
            const newAspect = window.innerWidth / window.innerHeight;
            camera.left = -d * newAspect;
            camera.right = d * newAspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Update shader time uniform
            vertexShaderMaterial.uniforms.uTime.value = elapsedTime;

            // Animate shader object
            artifactMesh.rotation.y = elapsedTime * 0.5;
            artifactMesh.rotation.x = Math.sin(elapsedTime * 0.3) * 0.2;

            if (controls) controls.update();
            renderer.render(scene, camera);
        }

        // Start render loop safely
        window.onload = function() {
            animate();
        };
    </script>
</body>
